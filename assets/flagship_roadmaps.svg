  <rect x="0" y="22" width="539" height="6" fill="#0B2A45"/>
  <circle cx="16" cy="14" r="3.5" fill="#5FE0C4"/>
  <text x="26" y="18" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold">FLAGSHIP COURSE ROADMAPS: 5-STAGE TECHNICAL ASCENT</text>
  <text x="525" y="18" fill="#5FE0C4" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" text-anchor="end">SKILL PROGRESSION METRIC</text>

  <!-- Track 1: Java & Data Structures (DSA) -->
  <g transform="translate(10, 36)">
    <rect x="0" y="0" width="519" height="64" rx="4" fill="#FFFFFF" stroke="#00A896" stroke-width="0.8"/>
    <rect x="0" y="0" width="112" height="64" rx="4" fill="#F0FDF4"/>
    <text x="10" y="22" fill="#0B2A45" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold">JAVA &amp; DSA ASCENT</text>
    <text x="10" y="37" fill="#047857" font-family="Helvetica, Arial, sans-serif" font-size="7.2" font-weight="bold">8–10 Weeks · 90 Days</text>
    <text x="10" y="52" fill="#64748B" font-family="Helvetica, Arial, sans-serif" font-size="6.2">Core + Problem Solving</text>
    
    <!-- Ascending Path Line -->
    <path d="M 130 46 L 210 38 L 295 30 L 385 22 L 475 14" fill="none" stroke="#00A896" stroke-width="2.6"/>
    
    <!-- 5 Points -->
    <circle cx="130" cy="46" r="4" fill="#0B2A45"/>
    <text x="130" y="58" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">Core Java &amp; OOP</text>

    <circle cx="210" cy="38" r="4" fill="#0B2A45"/>
    <text x="210" y="50" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">Arrays &amp; Recursion</text>

    <circle cx="295" cy="30" r="4" fill="#0B2A45"/>
    <text x="295" y="42" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">Trees &amp; Graphs</text>

    <circle cx="385" cy="22" r="4" fill="#0B2A45"/>
    <text x="385" y="34" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">Dynamic Prog.</text>

    <circle cx="475" cy="14" r="6" fill="#10B981"/>
    <rect x="434" y="32" width="82" height="21" rx="3.5" fill="#DCFCE7" stroke="#10B981" stroke-width="0.8"/>
    <text x="475" y="46" fill="#047857" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Interview-Ready</text>
