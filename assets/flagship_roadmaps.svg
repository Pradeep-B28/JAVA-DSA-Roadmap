  <!-- Track 2: Full Stack / MERN Development -->
  <g transform="translate(10, 107)">
    <rect x="0" y="0" width="519" height="64" rx="4" fill="#FFFFFF" stroke="#028090" stroke-width="0.8"/>
    <rect x="0" y="0" width="112" height="64" rx="4" fill="#F0F9FF"/>
