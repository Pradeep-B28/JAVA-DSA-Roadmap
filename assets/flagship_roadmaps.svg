    <text x="10" y="52" fill="#64748B" font-family="Helvetica, Arial, sans-serif" font-size="6.2">React + Node + Cloud</text>
    
    <!-- Ascending Path Line -->
    <path d="M 130 46 L 210 38 L 295 30 L 385 22 L 475 14" fill="none" stroke="#028090" stroke-width="2.6"/>
    
