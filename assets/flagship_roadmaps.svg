    <text x="295" y="42" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">Node/Express APIs</text>

    <circle cx="385" cy="22" r="4" fill="#0B2A45"/>
    <text x="385" y="34" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">MongoDB &amp; Auth</text>

    <circle cx="475" cy="14" r="6" fill="#028090"/>
    <rect x="432" y="32" width="86" height="21" rx="3.5" fill="#E0F2FE" stroke="#028090" stroke-width="0.8"/>
    <text x="475" y="46" fill="#0369A1" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Cloud Production</text>
  </g>

  <!-- Track 3: Placement Training & Aptitude -->
  <g transform="translate(10, 178)">
    <rect x="0" y="0" width="519" height="64" rx="4" fill="#FFFFFF" stroke="#6366F1" stroke-width="0.8"/>
    <rect x="0" y="0" width="112" height="64" rx="4" fill="#EEF2FF"/>
    <text x="10" y="22" fill="#0B2A45" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold">PLACEMENT &amp; APTITUDE</text>
    <text x="10" y="37" fill="#4338CA" font-family="Helvetica, Arial, sans-serif" font-size="7.2" font-weight="bold">6 Weeks · 45 Days</text>
    <text x="10" y="52" fill="#64748B" font-family="Helvetica, Arial, sans-serif" font-size="6.2">Company Drive Ready</text>
    
    <!-- Ascending Path Line -->
    <path d="M 130 46 L 210 38 L 295 30 L 385 22 L 475 14" fill="none" stroke="#6366F1" stroke-width="2.6"/>
    
    <!-- 5 Points -->
    <circle cx="130" cy="46" r="4" fill="#0B2A45"/>
    <text x="130" y="58" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">Speed Quant</text>

    <circle cx="210" cy="38" r="4" fill="#0B2A45"/>
    <text x="210" y="50" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">Verbal &amp; Logical</text>

    <circle cx="295" cy="30" r="4" fill="#0B2A45"/>
    <text x="295" y="42" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">Mock Tech Rounds</text>

    <circle cx="385" cy="22" r="4" fill="#0B2A45"/>
    <text x="385" y="34" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">Mock HR Viva</text>

    <circle cx="475" cy="14" r="6" fill="#6366F1"/>
    <rect x="434" y="32" width="82" height="21" rx="3.5" fill="#EEF2FF" stroke="#6366F1" stroke-width="0.8"/>
    <text x="475" y="46" fill="#4338CA" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Drive Simulation</text>
