    <circle cx="130" cy="46" r="4" fill="#0B2A45"/>
    <text x="130" y="58" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">Frontend Basics</text>

    <circle cx="210" cy="38" r="4" fill="#0B2A45"/>
    <text x="210" y="50" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">React 18 &amp; Redux</text>

