<svg xmlns="http://www.w3.org/2000/svg" width="539" height="255" viewBox="0 0 539 255">
  <defs>
    <linearGradient id="roadmapHdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B2A45"/>
      <stop offset="100%" stop-color="#0F385A"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="539" height="255" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Header Banner -->
