<svg xmlns="http://www.w3.org/2000/svg" width="539" height="315" viewBox="0 0 539 315">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="horribleZone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEE2E2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="excellentZone" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DCFCE7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="0" y="0" width="539" height="315" rx="6" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Header Banner -->
  <rect x="0" y="0" width="539" height="28" rx="6" fill="#0B2A45"/>
  <rect x="0" y="22" width="539" height="6" fill="#0B2A45"/>
  <circle cx="16" cy="14" r="3.5" fill="#5FE0C4"/>
  <text x="26" y="17.5" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="bold">ALGORITHMIC RUNTIME ARCHITECTURE (BIG-O COMPLEXITY)</text>
  <text x="523" y="17.5" fill="#5FE0C4" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="end">SOFTECH TECHNICAL STANDARD</text>

  <!-- Background Shaded Zones -->
  <!-- Red Zone (Horrible) -->
  <path d="M 65 38 L 220 38 L 140 255 L 65 255 Z" fill="url(#horribleZone)"/>
  <text x="105" y="55" fill="#DC2626" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="bold">HORRIBLE</text>

  <!-- Green Zone (Excellent) -->
  <path d="M 65 228 L 500 195 L 500 255 L 65 255 Z" fill="url(#excellentZone)"/>
  <text x="440" y="244" fill="#15803D" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="bold">EXCELLENT</text>

  <!-- Light Grid Lines -->
  <line x1="65" y1="75" x2="500" y2="75" stroke="#E2E8F0" stroke-width="0.7" stroke-dasharray="3,3"/>
  <line x1="65" y1="120" x2="500" y2="120" stroke="#E2E8F0" stroke-width="0.7" stroke-dasharray="3,3"/>
  <line x1="65" y1="165" x2="500" y2="165" stroke="#E2E8F0" stroke-width="0.7" stroke-dasharray="3,3"/>
  <line x1="65" y1="210" x2="500" y2="210" stroke="#E2E8F0" stroke-width="0.7" stroke-dasharray="3,3"/>

  <!-- Graph Main Axes -->
  <line x1="65" y1="255" x2="505" y2="255" stroke="#334155" stroke-width="1.8"/>
  <line x1="65" y1="255" x2="65" y2="35" stroke="#334155" stroke-width="1.8"/>

  <!-- Axis Arrows -->
  <polygon points="65,31 62,38 68,38" fill="#334155"/>
  <polygon points="508,255 502,252 502,258" fill="#334155"/>

  <!-- Y-Axis Label (Placed clearly to the left of the axis) -->
  <text transform="rotate(-90 22 145)" x="22" y="145" fill="#475569" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">OPERATIONS / RUNTIME ▲</text>
  <text x="500" y="269" fill="#475569" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="end">INPUT SIZE (N) ▶</text>

  <!-- Big-O Curves Plotted Realistically -->
  <!-- O(n^2) Quadratic - Red Curve -->
  <path d="M 65 255 Q 115 242 140 168 T 170 38" fill="none" stroke="#EF4444" stroke-width="2.8"/>
  <circle cx="170" cy="38" r="3.5" fill="#EF4444"/>
  <rect x="178" y="34" width="144" height="17" rx="3" fill="#FEE2E2" stroke="#EF4444" stroke-width="0.8"/>
  <text x="183" y="46" fill="#B91C1C" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold">O(n²) Quadratic · Nested Loops</text>

  <!-- O(n log n) Linearithmic - Purple Curve -->
  <path d="M 65 255 Q 185 238 315 155 T 450 75" fill="none" stroke="#6366F1" stroke-width="2.4"/>
  <circle cx="450" cy="75" r="3.2" fill="#6366F1"/>
  <rect x="365" y="63" width="140" height="17" rx="3" fill="#EEF2FF" stroke="#6366F1" stroke-width="0.8"/>
  <text x="370" y="75" fill="#4338CA" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold">O(n log n) · Merge / Quick Sort</text>

  <!-- O(n) Linear - Navy Diagonal Line -->
  <line x1="65" y1="255" x2="480" y2="145" stroke="#0B2A45" stroke-width="2.4"/>
  <circle cx="480" cy="145" r="3.2" fill="#0B2A45"/>
  <rect x="390" y="137" width="115" height="17" rx="3" fill="#F1F5F9" stroke="#0B2A45" stroke-width="0.8"/>
  <text x="395" y="149" fill="#0B2A45" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold">O(n) Linear · Single Pass</text>

  <!-- O(log n) Logarithmic - Teal Curve -->
  <path d="M 65 255 Q 140 220 280 210 T 485 200" fill="none" stroke="#028090" stroke-width="2.4"/>
  <circle cx="485" cy="200" r="3.2" fill="#028090"/>
  <rect x="380" y="192" width="125" height="17" rx="3" fill="#E6F9F5" stroke="#028090" stroke-width="0.8"/>
  <text x="385" y="204" fill="#028090" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold">O(log n) · Binary Search</text>

  <!-- O(1) Constant - Mint/Green Line -->
  <line x1="65" y1="245" x2="485" y2="245" stroke="#10B981" stroke-width="2.6"/>
  <circle cx="485" cy="245" r="3.5" fill="#10B981"/>
  <rect x="375" y="237" width="130" height="17" rx="3" fill="#DCFCE7" stroke="#10B981" stroke-width="0.8"/>
  <text x="380" y="249" fill="#15803D" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="bold">O(1) Constant · Hash Lookup</text>

  <!-- Bottom Visual Anchor Caption Banner -->
  <rect x="8" y="282" width="523" height="25" rx="4" fill="#0B2A45"/>
  <text x="269" y="298" fill="#5FE0C4" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">“We don’t just teach code. We teach code that scales.”</text>
</svg>
